<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>履歷編輯器｜多模板可視化 A4 PDF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #3f6df6;
      --primary-soft: #e6ecff;
      --accent: #ffb347;
      --text-main: #1f2933;
      --text-sub: #6b7280;
      --bg: #f3f4f8;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --radius-xl: 22px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC",
        "Microsoft JhengHei", system-ui, sans-serif;
      background: radial-gradient(circle at top left, #ecf2ff 0, #f8fafc 40%, #eef2ff 100%);
      color: var(--text-main);
      line-height: 1.6;
      padding: 24px;
      transition: background 0.3s ease, font-size 0.2s ease, font-family 0.2s ease;
    }

    body.font-small { font-size: 13px; }
    body.font-normal { font-size: 15px; }
    body.font-large { font-size: 17px; }

    body.font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC",
        "Microsoft JhengHei", system-ui, sans-serif;
    }
    body.font-serif {
      font-family: "Noto Serif TC", "PMingLiU", "Songti TC", serif;
    }
    body.font-rounded {
      font-family: "Noto Sans TC", "Microsoft JhengHei", "Segoe UI Rounded",
        system-ui, sans-serif;
    }

    @media (min-width: 1024px) {
      body {
        padding: 40px;
      }
    }

    /* A4 / 列印設定 */
    @page {
      size: A4;
      margin: 10mm;
    }

    @media print {
      html, body {
        padding: 0;
        margin: 0;
        background: #ffffff !important;
      }
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .page {
        box-shadow: none !important;
        border-radius: 0;
        margin: 0;
        width: auto;
        max-width: none;
      }
      .page::before,
      .page::after,
      .no-print {
        display: none !important;
      }
    }

    /* 工具列 */
    .toolbar {
      max-width: 210mm;
      margin: 0 auto 12px;
      padding: 10px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
      border: 1px solid rgba(209, 213, 219, 0.9);
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(0, 2.3fr);
      gap: 8px 14px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .toolbar label {
      font-size: 11px;
      white-space: nowrap;
    }

    .toolbar select {
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      outline: none;
    }

    .toolbar button {
      border: none;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(120deg, var(--primary), #6366f1);
      color: #f9fafb;
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.45);
      white-space: nowrap;
    }

    .toolbar button.secondary {
      background: #ffffff;
      color: #111827;
      border: 1px solid #cbd5f5;
      box-shadow: 0 4px 10px rgba(148, 163, 184, 0.4);
    }

    .toolbar button.danger {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      box-shadow: 0 4px 10px rgba(248, 113, 113, 0.4);
    }

    .status-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(239, 246, 255, 0.9);
      color: #1d4ed8;
      font-weight: 600;
    }

    .toolbar button.editing {
      background: #ffffff;
      color: #111827;
      border: 1px solid #cbd5f5;
      box-shadow: 0 4px 12px rgba(148, 163, 184, 0.5) inset;
    }

    .toolbar-status {
      font-size: 11px;
      opacity: 0.8;
      min-height: 1.2em;
    }

    .color-input,
    .font-input {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }

    .color-input input[type="color"] {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      padding: 0;
      background: transparent;
    }

    @media (max-width: 768px) {
      .toolbar {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    /* A4 容器 */
    .page {
      max-width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), #ffffff);
      border-radius: 28px;
      box-shadow:
        0 24px 60px rgba(15, 23, 42, 0.14),
        0 0 0 1px rgba(148, 163, 184, 0.25);
      overflow: hidden;
      position: relative;
      transition: box-shadow 0.2s ease, border-radius 0.2s ease;
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(40px);
      opacity: 0.6;
      pointer-events: none;
    }

    .page::before {
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(63, 109, 246, 0.35), transparent 70%);
      top: -60px;
      right: -60px;
    }

    .page::after {
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255, 179, 71, 0.3), transparent 70%);
      bottom: -40px;
      left: -40px;
    }

    #layoutRoot {
      position: relative;
      padding: 18px 18px 20px;
    }

    /* 編輯模式效果 */
    body.edit-mode .page {
      box-shadow:
        0 0 0 2px rgba(59, 130, 246, 0.4),
        0 12px 30px rgba(15, 23, 42, 0.12);
    }

    body.edit-mode #layoutRoot {
      outline: 1px dashed rgba(148, 163, 184, 0.9);
      outline-offset: 4px;
    }

    /* 打印預覽模式（螢幕） */
    body.print-preview {
      background: #ffffff;
      padding: 0;
    }

    body.print-preview .page {
      box-shadow: none;
      border-radius: 0;
      margin: 0 auto;
      max-width: 210mm;
      min-height: 297mm;
    }

    /* 模塊刪除按鈕 */
    .block-delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      padding: 0 6px;
      height: 18px;
      line-height: 18px;
      font-size: 10px;
      border-radius: 999px;
      border: 1px solid rgba(248, 113, 113, 0.8);
      background: rgba(254, 242, 242, 0.95);
      color: #b91c1c;
      cursor: pointer;
      z-index: 10;
    }

    .block-delete-btn:hover {
      background: #fee2e2;
    }

    body:not(.edit-mode) .block-delete-btn {
      display: none;
    }

    @media print {
      .block-delete-btn {
        display: none !important;
      }
    }

    /* 共用布局 class */
    .layout-flex {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    @media (min-width: 900px) {
      .layout-flex {
        flex-direction: row;
        gap: 22px;
      }
    }

    .sidebar-box {
      flex: 0 0 34%;
      max-width: 36%;
      padding: 16px 14px;
      border-radius: var(--radius-xl);
      background: radial-gradient(circle at top left, #f1f4ff 0, #ffffff 48%, #f9fafb 100%);
      border: 1px solid rgba(148, 163, 184, 0.45);
      box-shadow:
        0 10px 28px rgba(15, 23, 42, 0.12),
        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
    }

    @media (max-width: 899px) {
      .sidebar-box {
        width: 100%;
        max-width: 100%;
      }
    }

    .main-box {
      flex: 1;
      padding: 4px 0 4px 0;
    }

    .avatar-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 24px;
      background: linear-gradient(145deg, var(--primary), #9f7aea);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f9fafb;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.15em;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.26);
      overflow: hidden;
      position: relative;
    }

    .avatar img.js-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
      display: none;
    }

    .avatar span.js-avatar-initials {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .headline {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 2px;
    }

    .chip {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: rgba(248, 250, 252, 0.9);
      color: var(--text-sub);
      white-space: nowrap;
    }

    .chip.primary {
      border-color: transparent;
      background: linear-gradient(120deg, var(--primary), #6366f1);
      color: #f9fafb;
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.45);
    }

    .info-list {
      margin-top: 8px;
      padding: 8px 0 0;
      border-top: 1px dashed rgba(148, 163, 184, 0.6);
      display: grid;
      gap: 4px;
      font-size: 11px;
      color: var(--text-sub);
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .info-label {
      font-weight: 600;
      color: #4b5563;
      white-space: nowrap;
    }

    .info-value {
      text-align: right;
      flex: 1;
    }

    .section-side,
    .section-main {
      position: relative;
      margin-top: 10px;
      margin-bottom: 10px;
      padding: 10px 12px 11px;
      border-radius: var(--radius-lg);
      background: rgba(248, 250, 252, 0.9);
      border: 1px solid rgba(209, 213, 219, 0.9);
    }

    .section-main {
      padding: 12px 14px 12px;
      border-radius: var(--radius-xl);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4b5563;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-title::before {
      content: "";
      width: 14px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), #a855f7);
    }

    .section-tag {
      font-size: 10px;
      color: var(--text-sub);
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(255, 255, 255, 0.9);
    }

    .section-body {
      font-size: 11px;
      color: #374151;
      margin-top: 2px;
    }

    .section-body p + p {
      margin-top: 3px;
    }

    .bullet-list {
      margin-top: 3px;
      padding-left: 14px;
    }

    .bullet-list li {
      margin-bottom: 4px;
    }

    .section-main-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .section-main-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #111827;
      position: relative;
      padding-bottom: 3px;
    }

    .section-main-title::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 26px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), #a855f7);
    }

    .section-main-sub {
      font-size: 10px;
      color: var(--text-sub);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .timeline {
      position: relative;
      padding-left: 10px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 4px;
      bottom: 0;
      width: 1.4px;
      background: linear-gradient(to bottom, #c7d2fe, #e5e7eb);
    }

    .timeline-item {
      position: relative;
      padding-left: 14px;
      padding-bottom: 10px;
    }

    .timeline-item:last-child {
      padding-bottom: 0;
    }

    .timeline-bullet {
      position: absolute;
      left: 0;
      top: 4px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: radial-gradient(circle, var(--primary) 0, #a855f7 45%, #ffffff 80%);
      box-shadow: 0 0 0 3px rgba(199, 210, 254, 0.7);
    }

    .timeline-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 8px;
      margin-bottom: 3px;
    }

    .timeline-role {
      font-size: 12px;
      font-weight: 700;
    }

    .timeline-org {
      font-size: 11px;
      color: var(--text-sub);
    }

    .timeline-meta {
      margin-left: auto;
      font-size: 10px;
      color: var(--text-sub);
    }

    .timeline-highlights {
      margin-top: 2px;
      font-size: 11px;
      color: #374151;
    }

    .timeline-highlights ul {
      margin-top: 1px;
      padding-left: 14px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .small-tag {
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid rgba(191, 219, 254, 0.9);
    }

    .edu-list {
      display: grid;
      gap: 6px;
      font-size: 11px;
    }

    .edu-item {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    .edu-main {
      font-weight: 600;
    }

    .edu-sub {
      font-size: 10px;
      color: var(--text-sub);
      margin-top: 1px;
    }

    .edu-time {
      font-size: 10px;
      color: var(--text-sub);
      white-space: nowrap;
      align-self: center;
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .skill-tag {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      color: #3730a3;
    }

    .note {
      font-size: 10px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* 極簡模板 header */
    .simple-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .simple-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .simple-name {
      font-size: 22px;
      font-weight: 800;
    }

    .simple-title {
      font-size: 12px;
      color: var(--text-sub);
    }

    .simple-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .simple-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), #9f7aea);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f9fafb;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.15em;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.22);
      overflow: hidden;
      position: relative;
    }

    .simple-avatar img.js-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
      display: none;
    }

    .simple-avatar span.js-avatar-initials {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .simple-contact {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 11px;
      color: var(--text-sub);
      justify-content: flex-end;
    }

    /* 插入圖片預設樣式 */
    .inserted-image {
      max-width: 100%;
      border-radius: 8px;
      margin: 6px 0;
      display: block;
    }

    @media (max-width: 599px) {
      #layoutRoot {
        padding: 12px 10px 14px;
      }
      .name,
      .simple-name {
        font-size: 20px;
      }
      .simple-header-top {
        flex-direction: column;
        align-items: flex-start;
      }
      .simple-contact {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <!-- 工具列 -->
  <div class="toolbar no-print">
    <div class="toolbar-row">
      <label for="templateSelect">模板：</label>
      <select id="templateSelect">
        <option value="teacher">教師風格（側欄 + 時間軸）</option>
        <option value="simple">極簡風格（單欄）</option>
      </select>

      <button id="toggleEdit">編輯模式</button>
      <button id="saveBtn" class="secondary">保存到本機</button>
      <button id="addBlockBtn" class="secondary">新增內容模塊</button>
      <button id="printModeBtn" class="secondary">切換打印預覽模式</button>
      <button id="avatarBtn" class="secondary">設定頭像</button>
      <button id="insertImgBtn" class="secondary">插入圖片</button>
    </div>

    <div class="toolbar-row">
      <label for="resumeSelect">履歷：</label>
      <select id="resumeSelect"></select>
      <button id="newResumeBtn" class="secondary">新增履歷</button>

      <label for="versionSelect">版本：</label>
      <select id="versionSelect"></select>
      <button id="newVersionBtn" class="secondary">另存新版本</button>
      <button id="saveVersionBtn" class="secondary">保存到伺服器</button>
      <button id="deleteVersionBtn" class="danger">刪除版本</button>

      <label for="stylePresetSelect">樣式：</label>
      <select id="stylePresetSelect"></select>
      <button id="saveStylePresetBtn" class="secondary">保存樣式</button>
      <span class="status-badge" id="backendStatus">後端連線中...</span>
    </div>

    <div class="toolbar-row">
      <div class="font-input">
        <label for="fontSizeSelect">字體大小</label>
        <select id="fontSizeSelect">
          <option value="small">小</option>
          <option value="normal" selected>一般</option>
          <option value="large">大</option>
        </select>
      </div>
      <div class="font-input">
        <label for="fontFamilySelect">字體風格</label>
        <select id="fontFamilySelect">
          <option value="sans" selected>預設</option>
          <option value="serif">襯線（較正式）</option>
          <option value="rounded">圓體（較親和）</option>
        </select>
      </div>

      <div class="color-input">
        <label for="primaryColor">主色</label>
        <input type="color" id="primaryColor" value="#3f6df6" />
      </div>
      <div class="color-input">
        <label for="accentColor">輔色</label>
        <input type="color" id="accentColor" value="#ffb347" />
      </div>
      <div class="color-input">
        <label for="bgColor">背景</label>
        <input type="color" id="bgColor" value="#f3f4f8" />
      </div>

      <button id="resetTemplateBtn" class="secondary">重置當前模板</button>
      <button id="resetAllBtn" class="danger">重置所有模板與設定</button>
      <span class="toolbar-status" id="statusText">提示：啟用編輯模式後，直接點內容即可修改，系統會自動保存。</span>
    </div>
  </div>

  <!-- 隱藏檔案 input -->
  <input type="file" id="avatarInput" accept="image/*" class="no-print" style="display:none" />
  <input type="file" id="insertImgInput" accept="image/*" class="no-print" style="display:none" />

  <main class="page">
    <div id="layoutRoot">
      <!-- 模板由 JS 注入 -->
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const STORAGE_PREFIX = 'cv_multi_tpl_v2_';
      const KEY_ACTIVE_TEMPLATE = STORAGE_PREFIX + 'active_template';
      const KEY_THEME = STORAGE_PREFIX + 'theme';
      const KEY_FONT = STORAGE_PREFIX + 'font';
      const KEY_AVATAR = STORAGE_PREFIX + 'avatar';
      const API_URL = 'api.php';

      const layoutRoot = document.getElementById('layoutRoot');
      const templateSelect = document.getElementById('templateSelect');
      const toggleEditBtn = document.getElementById('toggleEdit');

      async function fetchJSON(url, options = {}) {
        const res = await fetch(url, options);
        if (!res.ok) {
          throw new Error('Network response was not ok');
        }
        return res.json();
      }

      function collectTheme() {
        return {
          primary: primaryColorInput.value,
          accent: accentColorInput.value,
          bg: bgColorInput.value
        };
      }

      function collectFontSettings() {
        return {
          size: fontSizeSelect.value,
          family: fontFamilySelect.value
        };
      }

      function renderResumeOptions(resumes) {
        resumeIndex = new Map();
        resumeSelect.innerHTML = '';
        resumes.forEach(resume => {
          resumeIndex.set(String(resume.id), resume);
          const option = document.createElement('option');
          option.value = resume.id;
          option.textContent = resume.name;
          resumeSelect.appendChild(option);
        });
      }

      function renderVersionOptions(versions) {
        versionSelect.innerHTML = '';
        versions.forEach(version => {
          const option = document.createElement('option');
          option.value = version.id;
          option.textContent = version.label;
          versionSelect.appendChild(option);
        });
      }

      function renderStylePresetOptions(presets) {
        stylePresetSelect.innerHTML = '';
        const defaultOption = document.createElement('option');
        defaultOption.value = '';
        defaultOption.textContent = '套用樣式...';
        stylePresetSelect.appendChild(defaultOption);
        presets.forEach(preset => {
          const option = document.createElement('option');
          option.value = preset.id;
          option.textContent = preset.name;
          stylePresetSelect.appendChild(option);
        });
      }

      async function loadResumes() {
        const data = await fetchJSON(`${API_URL}?action=list_resumes`);
        const resumes = data.resumes || [];
        renderResumeOptions(resumes);
        return resumes;
      }

      async function createResume(name, useCurrentLayout = false) {
        const templateId = templateSelect.value;
        const html = useCurrentLayout ? layoutRoot.innerHTML : templates[templateId];
        const payload = new URLSearchParams({
          action: 'create_resume',
          name,
          template_id: templateId,
          html,
          theme_json: JSON.stringify(collectTheme()),
          font_json: JSON.stringify(collectFontSettings()),
          avatar_data: currentAvatarData || '',
          version_label: '初始版本'
        });
        const data = await fetchJSON(API_URL, {
          method: 'POST',
          body: payload
        });
        currentResumeId = data.resume_id;
        currentVersionId = data.version_id;
        return data;
      }

      async function loadVersions(resumeId) {
        if (!resumeId) return [];
        const data = await fetchJSON(`${API_URL}?action=list_versions&resume_id=${resumeId}`);
        const versions = data.versions || [];
        renderVersionOptions(versions);
        return versions;
      }

        layoutRoot.innerHTML = html || templates[templateId] || '';

      }

      async function loadVersion(versionId) {
        if (!versionId) return;
        const data = await fetchJSON(`${API_URL}?action=load_version&version_id=${versionId}`);
        const version = data.version;
        if (!version) return;
        currentResumeId = version.resume_id;
        currentVersionId = version.id;
        applyLayoutHtml(version.html_content, version.template_id);
        if (version.theme_json) {
          try {
            applyTheme(JSON.parse(version.theme_json));
          } catch (e) {
            console.error(e);
          }
        }
        if (version.font_json) {
          try {
            applyFontSettings(JSON.parse(version.font_json));
          } catch (e) {
            console.error(e);
          }
        }
        if (version.avatar_data) {
          currentAvatarData = version.avatar_data;
          localStorage.setItem(KEY_AVATAR, version.avatar_data);
          applyAvatarToDOM(version.avatar_data);
        } else {
          currentAvatarData = null;
          localStorage.removeItem(KEY_AVATAR);
          applyAvatarToDOM(null);
        }
        showStatus('已載入伺服器版本。');
      }

      async function saveActiveVersion({ createNew = false, label = '' } = {}) {
        if (!backendAvailable || !currentResumeId) return;
        const payload = new URLSearchParams({
          action: 'save_version',
          resume_id: currentResumeId,
          version_id: createNew ? '' : (currentVersionId || ''),
          label: label || (versionSelect.selectedOptions[0]?.textContent ?? '更新版本'),
          template_id: templateSelect.value,
          html: layoutRoot.innerHTML,
          theme_json: JSON.stringify(collectTheme()),
          font_json: JSON.stringify(collectFontSettings()),
          avatar_data: currentAvatarData || ''
        });
        const data = await fetchJSON(API_URL, {
          method: 'POST',
          body: payload
        });
        currentVersionId = data.version_id || currentVersionId;
        if (createNew) {
          await loadVersions(currentResumeId);
          versionSelect.value = currentVersionId;
        }
        showStatus('已同步保存至伺服器。');
      }

      async function loadStylePresets(resumeId) {
        if (!resumeId) return [];
        const data = await fetchJSON(`${API_URL}?action=list_style_presets&resume_id=${resumeId}`);
        stylePresets = data.presets || [];
        renderStylePresetOptions(stylePresets);
        return stylePresets;
      }

      async function saveStylePreset() {
        if (!backendAvailable || !currentResumeId) return;
        const name = prompt('輸入樣式名稱（例如：藍色專業版）');
        if (!name) return;
        const payload = new URLSearchParams({
          action: 'save_style_preset',
          resume_id: currentResumeId,
          name,
          theme_json: JSON.stringify(collectTheme()),
          font_json: JSON.stringify(collectFontSettings())
        });
        await fetchJSON(API_URL, { method: 'POST', body: payload });
        await loadStylePresets(currentResumeId);
        showStatus('樣式已保存，可在下拉選單中套用。');
      }

      function applyStylePreset(presetId) {
        const preset = stylePresets.find(item => String(item.id) === String(presetId));
        if (!preset) return;
        if (preset.theme_json) {
          try {
            applyTheme(JSON.parse(preset.theme_json));
          } catch (e) {
            console.error(e);
          }
        }
        if (preset.font_json) {
          try {
            applyFontSettings(JSON.parse(preset.font_json));
          } catch (e) {
            console.error(e);
          }
        }
        showStatus('樣式已套用。');
      }

      async function initBackend() {
        try {
          await fetchJSON(`${API_URL}?action=health`);
          setBackendStatus(true);
        } catch (e) {
          setBackendStatus(false);
          return;
        }

        try {
          const resumes = await loadResumes();
          if (!resumes.length) {
            await createResume('我的履歷', false);
          } else {
            const activeResume = resumes[0];
            currentResumeId = activeResume.id;
            resumeSelect.value = String(activeResume.id);
          }
          const versions = await loadVersions(currentResumeId);
          const resumeRecord = resumeIndex.get(String(currentResumeId));
          const preferredVersion = resumeRecord?.active_version_id || versions[0]?.id;
          if (preferredVersion) {
            currentVersionId = preferredVersion;
            versionSelect.value = String(preferredVersion);
            await loadVersion(preferredVersion);
          }
          await loadStylePresets(currentResumeId);
        } catch (e) {
          console.error(e);
          setBackendStatus(false, '後端連線失敗，已切換本機保存');
        }
      }

      function getLayoutKey(templateId) {
        return STORAGE_PREFIX + 'layout_' + templateId;
      }

      function showStatus(text) {
        statusText.textContent = text;
        statusText.style.opacity = '1';
        clearTimeout(statusText._timer);
        statusText._timer = setTimeout(() => {
          statusText.style.opacity = '0.8';
        }, 2500);
      }

      function applyTheme(theme) {
        if (!theme) return;
        if (theme.primary) {
          document.documentElement.style.setProperty('--primary', theme.primary);
          primaryColorInput.value = theme.primary;
        }
        if (theme.accent) {
          document.documentElement.style.setProperty('--accent', theme.accent);
          accentColorInput.value = theme.accent;
        }
        if (theme.bg) {
          document.documentElement.style.setProperty('--bg', theme.bg);
          bgColorInput.value = theme.bg;
          document.body.style.background = theme.bg;
        }
      }

      function saveTheme() {
        const theme = {
          primary: primaryColorInput.value,
          accent: accentColorInput.value,
          bg: bgColorInput.value
        };
        localStorage.setItem(KEY_THEME, JSON.stringify(theme));
        showStatus('顏色主題已保存。');
        if (backendAvailable) {
          saveActiveVersion();
        }
      }

      function loadTheme() {
        const raw = localStorage.getItem(KEY_THEME);
        if (!raw) return;
        try {
          const theme = JSON.parse(raw);
          applyTheme(theme);
        } catch (e) {
          console.error(e);
        }
      }

      function applyFontSettings(settings) {
        document.body.classList.remove('font-small','font-normal','font-large');
        document.body.classList.remove('font-sans','font-serif','font-rounded');
        document.body.classList.add('font-' + (settings.size || 'normal'));
        document.body.classList.add('font-' + (settings.family || 'sans'));
        fontSizeSelect.value = settings.size || 'normal';
        fontFamilySelect.value = settings.family || 'sans';
      }

      function saveFontSettings() {
        const settings = {
          size: fontSizeSelect.value,
          family: fontFamilySelect.value
        };
        localStorage.setItem(KEY_FONT, JSON.stringify(settings));
        showStatus('字體設定已保存。');
        if (backendAvailable) {
          saveActiveVersion();
        }
      }

      function loadFontSettings() {
        const raw = localStorage.getItem(KEY_FONT);
        if (raw) {
          try {
            const settings = JSON.parse(raw);
            applyFontSettings(settings);
            return;
          } catch (e) {
            console.error(e);
          }
        }
        applyFontSettings({ size: 'normal', family: 'sans' });
      }

      function attachDeleteButtons() {
        const blocks = layoutRoot.querySelectorAll('[data-block]');
        blocks.forEach(block => {
          if (!block.querySelector('.block-delete-btn')) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'block-delete-btn no-print';
            btn.textContent = '刪除';
            btn.setAttribute('data-role', 'delete-block');
            btn.contentEditable = 'false';
            block.style.position = 'relative';
            block.prepend(btn);
          }
        });
      }

      function removeDeleteButtons() {
        const btns = layoutRoot.querySelectorAll('.block-delete-btn');
        btns.forEach(b => b.remove());
      }

      function setEditMode(on) {
        editMode = on;
        document.body.classList.toggle('edit-mode', editMode);
        layoutRoot.contentEditable = editMode ? 'true' : 'false';
        toggleEditBtn.classList.toggle('editing', editMode);
        toggleEditBtn.textContent = editMode ? '關閉編輯模式' : '編輯模式';
        if (editMode) {
          attachDeleteButtons();
          showStatus('編輯模式已開啟：可直接修改內容、刪除模塊、新增模塊。');
        } else {
          removeDeleteButtons();
          showStatus('編輯模式已關閉：內容已鎖定，可直接列印或匯出 PDF。');
        }
      }

      function setPrintMode(on) {
        printMode = on;
        document.body.classList.toggle('print-preview', printMode);
        printModeBtn.textContent = printMode ? '關閉打印預覽模式' : '切換打印預覽模式';
        showStatus(printMode ? '已切換為打印預覽模式，按 Ctrl+P 可直接預覽列印。' : '已退出打印預覽模式。');
      }

      function saveLayoutFor(templateId) {
        const key = getLayoutKey(templateId);
        localStorage.setItem(key, layoutRoot.innerHTML);
        if (backendAvailable) {
          saveActiveVersion();
        }
      }

      function loadLayoutFor(templateId, resetToDefault = false) {
        const key = getLayoutKey(templateId);
        const saved = resetToDefault ? null : localStorage.getItem(key);
        const html = saved || templates[templateId];
        layoutRoot.innerHTML = html;
        templateSelect.value = templateId;
        if (editMode) attachDeleteButtons();
        applyAvatarFromStorage();
      }

      function setActiveTemplate(templateId, resetToDefault = false) {
        loadLayoutFor(templateId, resetToDefault);
        localStorage.setItem(KEY_ACTIVE_TEMPLATE, templateId);
        showStatus(resetToDefault ? '已重置為當前模板的預設內容。' : '已切換模板。');
      }

      function getActiveTemplate() {
        return localStorage.getItem(KEY_ACTIVE_TEMPLATE) || 'teacher';
      }

      function addBlock() {
        const activeId = getActiveTemplate();
        if (activeId === 'teacher') {
          const main = layoutRoot.querySelector('.main-box');
          if (!main) {
            alert('找不到主內容區，無法新增模塊。');
            return;
          }
          const section = document.createElement('section');
          section.className = 'section-main';
          section.setAttribute('data-block', '');
          section.innerHTML = `
            <header class="section-main-header">
              <h2 class="section-main-title">自訂內容模塊標題</h2>
              <span class="section-main-sub">Custom Section</span>
            </header>
            <div class="section-body">
              <p>這是一個新加入的內容模塊，你可以在編輯模式中自由修改標題與內容，例如新增「教學理念」、「自我評價」、「獎項與榮譽」等。</p>
              <ul class="bullet-list">
                <li>在此列出重點經驗或成就。</li>
                <li>你也可以刪除這整個模塊，或再新增其他模塊。</li>
              </ul>
            </div>
          `;
          main.appendChild(section);
        } else {
          const container = layoutRoot.lastElementChild || layoutRoot;
          const section = document.createElement('section');
          section.className = 'section-main';
          section.setAttribute('data-block', '');
          section.innerHTML = `
            <header class="section-main-header">
              <h2 class="section-main-title">自訂內容模塊</h2>
              <span class="section-main-sub">Custom Section</span>
            </header>
            <div class="section-body">
              <p>可用作補充說明，例如教學理念、自我評價、興趣與專長等內容。</p>
              <ul class="bullet-list">
                <li>點擊編輯模式後，直接修改這裡的文字。</li>
                <li>如果不需要這個模塊，可以按右上角「刪除」。</li>
              </ul>
            </div>
          `;
          container.appendChild(section);
        }
        if (editMode) attachDeleteButtons();
        showStatus('已新增一個內容模塊。');
      }

      /* Avatar 處理 */
      function applyAvatarToDOM(dataUrl) {
        const imgs = layoutRoot.querySelectorAll('.js-avatar-img');
        const initials = layoutRoot.querySelectorAll('.js-avatar-initials');
        if (dataUrl) {
          imgs.forEach(img => {
            img.src = dataUrl;
            img.style.display = 'block';
          });
          initials.forEach(span => {
            span.style.display = 'none';
          });
        } else {
          imgs.forEach(img => {
            img.removeAttribute('src');
            img.style.display = 'none';
          });
          initials.forEach(span => {
            span.style.display = '';
          });
        }
      }

      function applyAvatarFromStorage() {
        const dataUrl = localStorage.getItem(KEY_AVATAR);
        currentAvatarData = dataUrl || null;
        applyAvatarToDOM(dataUrl);
      }

      function handleAvatarFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
          const dataUrl = e.target.result;
          currentAvatarData = dataUrl;
          localStorage.setItem(KEY_AVATAR, dataUrl);
          applyAvatarToDOM(dataUrl);
          showStatus('頭像已更新並保存。');
          if (backendAvailable) {
            saveActiveVersion();
          }
        };
        reader.readAsDataURL(file);
      }

      /* 插入圖片 */
      function insertImageAtSelection(dataUrl) {
        const img = document.createElement('img');
        img.src = dataUrl;
        img.alt = '插入圖片';
        img.className = 'inserted-image';
        const sel = window.getSelection();
        if (sel && sel.rangeCount > 0) {
          const range = sel.getRangeAt(0);
          range.collapse(false);
          range.insertNode(img);
          range.setStartAfter(img);
          range.setEndAfter(img);
          sel.removeAllRanges();
          sel.addRange(range);
        } else {
          layoutRoot.appendChild(img);
        }
        const activeId = getActiveTemplate();
        saveLayoutFor(activeId);
        showStatus('圖片已插入並保存。');
      }

      function handleInsertImageFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
          insertImageAtSelection(e.target.result);
        };
        reader.readAsDataURL(file);
      }

      /* 事件綁定 */
      toggleEditBtn.addEventListener('click', () => {
        setEditMode(!editMode);
      });

      saveBtn.addEventListener('click', () => {
        const activeId = getActiveTemplate();
        saveLayoutFor(activeId);
        showStatus('已手動保存到本機（localStorage）。');
      });

      printModeBtn.addEventListener('click', () => {
        setPrintMode(!printMode);
      });

      resetTemplateBtn.addEventListener('click', () => {
        const activeId = getActiveTemplate();
        if (confirm('確定要重置當前模板為預設內容？本模板已保存的修改將被清除。')) {
          localStorage.removeItem(getLayoutKey(activeId));
          setActiveTemplate(activeId, true);
        }
      });

      resetAllBtn.addEventListener('click', () => {
        if (confirm('確定要重置所有模板與設定？所有已保存的內容都會被清除。')) {
          Object.keys(localStorage)
            .filter(k => k.startsWith(STORAGE_PREFIX))
            .forEach(k => localStorage.removeItem(k));
          window.location.reload();
        }
      });

      addBlockBtn.addEventListener('click', () => {
        addBlock();
      });

      templateSelect.addEventListener('change', () => {
        const id = templateSelect.value;
        setActiveTemplate(id, false);
        if (backendAvailable) {
          saveActiveVersion({ label: versionSelect.selectedOptions[0]?.textContent || '更新版本' });
        }
      });

      resumeSelect.addEventListener('change', async () => {
        if (!backendAvailable) return;
        currentResumeId = resumeSelect.value;
        const versions = await loadVersions(currentResumeId);
        const resumeRecord = resumeIndex.get(String(currentResumeId));
        const preferredVersion = resumeRecord?.active_version_id || versions[0]?.id;
        if (preferredVersion) {
          currentVersionId = preferredVersion;
          versionSelect.value = String(preferredVersion);
          await loadVersion(preferredVersion);
          await loadStylePresets(currentResumeId);
        }
      });

      versionSelect.addEventListener('change', async () => {
        if (!backendAvailable) return;
        currentVersionId = versionSelect.value;
        await loadVersion(currentVersionId);
      });

      newResumeBtn.addEventListener('click', async () => {
        if (!backendAvailable) return;
        const name = prompt('輸入新履歷名稱');
        if (!name) return;
        const data = await createResume(name, true);
        const resumes = await loadResumes();
        resumeSelect.value = String(data.resume_id);
        currentResumeId = data.resume_id;
        const versions = await loadVersions(currentResumeId);
        versionSelect.value = String(data.version_id);
        currentVersionId = data.version_id;
        await loadVersion(currentVersionId);
        await loadStylePresets(currentResumeId);
      });

      newVersionBtn.addEventListener('click', async () => {
        if (!backendAvailable || !currentResumeId) return;
        const label = prompt('輸入新版本名稱');
        if (!label) return;
        await saveActiveVersion({ createNew: true, label });
      });

      saveVersionBtn.addEventListener('click', async () => {
        if (!backendAvailable || !currentResumeId) return;
        await saveActiveVersion();
      });

      deleteVersionBtn.addEventListener('click', async () => {
        if (!backendAvailable || !currentVersionId) return;
        if (!confirm('確定刪除這個版本？刪除後將無法復原。')) return;
        const payload = new URLSearchParams({
          action: 'delete_version',
          version_id: currentVersionId
        });
        await fetchJSON(API_URL, { method: 'POST', body: payload });
        const versions = await loadVersions(currentResumeId);
        const nextVersion = versions[0]?.id;
        if (nextVersion) {
          currentVersionId = nextVersion;
          versionSelect.value = String(nextVersion);
          await loadVersion(nextVersion);
        }
      });

      saveStylePresetBtn.addEventListener('click', () => {
        saveStylePreset();
      });

      stylePresetSelect.addEventListener('change', () => {
        if (!backendAvailable) return;
        applyStylePreset(stylePresetSelect.value);
      });

      [primaryColorInput, accentColorInput, bgColorInput].forEach(input => {
        input.addEventListener('input', () => {
          applyTheme({
            primary: primaryColorInput.value,
            accent: accentColorInput.value,
            bg: bgColorInput.value
          });
          clearTimeout(autosaveTimer);
          autosaveTimer = setTimeout(() => {
            saveTheme();
          }, 500);
        });
      });

      fontSizeSelect.addEventListener('change', () => {
        applyFontSettings({ size: fontSizeSelect.value, family: fontFamilySelect.value });
        saveFontSettings();
      });

      fontFamilySelect.addEventListener('change', () => {
        applyFontSettings({ size: fontSizeSelect.value, family: fontFamilySelect.value });
        saveFontSettings();
      });

      layoutRoot.addEventListener('input', () => {
        if (!editMode) return;
        statusText.textContent = '正在自動保存...';
        statusText.style.opacity = '1';
        clearTimeout(autosaveTimer);
        autosaveTimer = setTimeout(() => {
          const activeId = getActiveTemplate();
          saveLayoutFor(activeId);
          showStatus('已自動保存。');
        }, 800);
      });

      layoutRoot.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-role="delete-block"]');
        if (!btn) return;
        const block = btn.closest('[data-block]');
        if (block && confirm('確定刪除這個模塊嗎？')) {
          block.remove();
          const activeId = getActiveTemplate();
          saveLayoutFor(activeId);
          showStatus('已刪除模塊並保存。');
        }
      });

      avatarBtn.addEventListener('click', () => {
        avatarInput.click();
      });

      avatarInput.addEventListener('change', () => {
        const file = avatarInput.files[0];
        handleAvatarFile(file);
        avatarInput.value = '';
      });

      insertImgBtn.addEventListener('click', () => {
        insertImgInput.click();
      });

      insertImgInput.addEventListener('change', () => {
        const file = insertImgInput.files[0];
        handleInsertImageFile(file);
        insertImgInput.value = '';
      });

      window.addEventListener('beforeunload', () => {
        const activeId = getActiveTemplate();
        saveLayoutFor(activeId);
        const theme = {
          primary: primaryColorInput.value,
          accent: accentColorInput.value,
          bg: bgColorInput.value
        };
        localStorage.setItem(KEY_THEME, JSON.stringify(theme));
        const fontSettings = {
          size: fontSizeSelect.value,
          family: fontFamilySelect.value
        };
        localStorage.setItem(KEY_FONT, JSON.stringify(fontSettings));
      });

      /* 初始化 */
      loadTheme();
      loadFontSettings();
      const initialTemplate = getActiveTemplate();
      templateSelect.value = initialTemplate;
      setActiveTemplate(initialTemplate, false);
      setEditMode(true);
      setPrintMode(false);
      setBackendStatus(false, '後端連線中...');
      initBackend();
    });
  </script>
</body>
</html>
